name: get-chat-id
on: workflow_dispatch
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: List chats the bot has seen
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          u = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/getUpdates"))
          me = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/getMe"))
          print("BOT:", me["result"]["username"])
          seen = {}
          for x in u.get("result", []):
              for k in ("message", "my_chat_member", "channel_post", "edited_message"):
                  c = (x.get(k) or {}).get("chat")
                  if c: seen[c["id"]] = (c["type"], c.get("title") or c.get("first_name"))
          for cid, (t, name) in seen.items():
              print("CHAT", cid, t, name)
          if not seen: print("NO CHATS YET")
          PY
